<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Website</title>

    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            background-image: url("images.jpg");
            background-size: cover;
            background-position: center;

            color: white;
        }

        .main{
            min-height: 100vh;
            background-color: rgba(0,0,0,0.5);
        }

        nav{
            display: flex;
            justify-content: space-between;

            padding: 25px 50px;
        }

        nav a{
            color: white;
            margin-left: 20px;
        }

        .content{
            text-align: center;
            margin-top: 150px;
        }

        .content h1{
            font-size: 50px;
            margin-bottom: 20px;
        }

        .content p{
            font-size: 20px;
            margin-bottom: 30px;
        }

        button{
            padding: 15px 30px;

            border: none;
            border-radius: 5px;

            background-color: white;
        }

        button:hover{
            background-color: black;
            color: white;
        }

    </style>
</head>

<body>

    <div class="main">

        <nav>

            <h2>Travel</h2>

            <div>
                <a href="#">Home</a>
                <a href="#">Places</a>
                <a href="#">Contact</a>
            </div>

        </nav>

        <div class="content">

            <h1>Explore The World</h1>

            <p>
                Discover beautiful places and create amazing memories.
            </p>

            <button>
                Explore Now
            </button>

        </div>

    </div>

</body>
</html>
