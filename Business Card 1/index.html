<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUsiness Card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(69, 72, 75);
           

        }
        .card{
            background-color: rgb(255, 252, 252);
            height: 460px;
           width: 355px;
           border: 2px solid black;
           border-radius: 7px;
           margin: 50px;
           margin-left: 550px;
           

        }
        .image img{
            border: 2px solid rgb(255, 248, 248);
            border-radius: 10%;
            width: 300px;
            height: 200px;
            padding: 10px;
            margin: 10px;
            margin-left: 15px;
            border: 1px solid gray;
            /* border-radius: 10px; */
            


        }
        
        .cap span{
              
            border: 2px solid rgb(120, 115, 115);
            border-radius: 19px;
            /* margin ki waja sy top buttom or left right control hota ha */
            margin-left: 70px;
            font-size: 19px;
            /* padding ki waja sy border radius control hota ha */
            padding: 3px;
            color: rgb(74, 72, 72);
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .content{
            padding: 13px;
            margin: 10px;
            
        }
        .content p{
           
            margin: 5px;
            padding: 3px;
            font-size: 13px;
            color: gray;
        }
        
        
        .content h2{
            margin: -5px;
             


        }
        button{
            text-align: center;
        }
        button{
            padding: 9px;
            border-radius: 17px;
            margin: -10px;
            color: rgb(2, 3, 5);
            background-color: aliceblue;
            border: 1px solid black;
            margin-left: 120px;
            width: 8vw;



        }
        button:hover{
            color: rgb(239, 228, 228);
            background-color: rgb(0, 0, 0);
        }

    </style>
</head>

<body>
   <div class="card">
    <div class="image">
        <img src="truck.png" alt="" >
    </div>
    <div class="cap">
        <span>Truck</span>
        <span>Moter</span>
    </div>
    <div class="content">
        <h2>Qutab</h2>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Expedita, corrupti quibusdam deserunt asperiores quos veritatis nulla praesentium, fugiat rerum cum, tenetur amet harum!</p>
    </div>
    
        <button >Submit</button>
    

   </div>


</body>

</html>
