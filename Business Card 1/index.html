<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUsiness Card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(69, 72, 75);
           

        }
        .card{
            background-color: rgb(255, 252, 252);
            height: 360px;
           width: 255px;
           border: 2px solid black;
           border-radius: 7px;
           

        }
        .image img{
            border: 2px solid rgb(255, 248, 248);
            border-radius: 8%;
            width: 235px;
            height: 150px;
            padding: 5px;
            margin: 5px;

        }
        .cap span{
            
            border: 2px solid rgb(222, 220, 220);
            border-radius: 19px;
            /* margin ki waja sy top buttom or left right control hota ha */
            margin: 0 -41px 0 51px;
            font-size: 19px;
            /* padding ki waja sy border radius control hota ha */
            padding: 0% 3px;
            color: gray;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .content{
            padding: 13px;
            
        }
        .content p{
           
            margin: 5px;
            padding: 3px;
            font-size: 13px;
            color: gray;
        }
        
        
        .content h2{
            margin: -5px;
             


        }
        .button{
            text-align: center;
        }
        .button button{
            padding: 3px;
            border-radius: 17px;
            margin: -10px;
            color: rgb(26, 70, 138);
            background-color: rgb(13, 111, 192);
            border-radius: 2px solid rgb(39, 163, 208);
        }

    </style>
</head>

<body>
   <div class="card">
    <div class="image">
        <img src="truck.png" alt="" >
    </div>
    <div class="cap">
        <span>Truck</span>
        <span>Moter</span>
    </div>
    <div class="content">
        <h2>Qutab</h2>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Expedita, corrupti quibusdam deserunt asperiores quos veritatis nulla praesentium, fugiat rerum cum, tenetur amet harum!</p>
    </div>
    <div class="button">
        <button>Submit</button>
    </div>

   </div>


</body>

</html>
