<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Website</title>

    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            background-image: url("images.jpg");
            background-size: cover;
            background-position: center;
            background-color: rgb(82, 9, 115);

            color: white;
        }

        .main{
            min-height: 100vh;
            background-color: rgba(0,0,0,0.5);
        }

        nav{
            display: flex;
            justify-content: space-between;

            padding: 25px 50px;
        }

        nav a{
            margin-left: 20px;
            color:  rgb(148, 11, 148);
            background-color: aliceblue;
            border: 2px solid white;
            border-radius: 10px;
            font-size: 20px;
            font-weight:bold ;
            padding: 15px 10px;

           
        }
        h2{
            color: rgb(148, 11, 148);
            font-size: 60px;
            
        }

        .content{
            text-align: center;
            margin-top: 150px;
        }

        .content h1{
            font-size: 50px;
            margin-bottom: 20px;
        }

        .content p{
            font-size: 20px;
            margin-bottom: 30px;
        }

        button{
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            background-color: white;
            font-weight: bold;
            font-size: 15px;
            color: rgb(0, 0, 0) ;
        }

        button:hover{
            background-color: rgb(148, 11, 148);
            color: white;
        }
        div .a{
            display: inline-block;
            justify-content: center;
            height: 45px;
            margin: 5px;
            width: 80px;
            text-align: center;
            align-items: center;
            
        }
        .a:hover{
            background-color: rgb(148, 11, 148);
            color: aliceblue;
        }
        .a:active{
            background-color: rgb(14, 13, 14);
        }
        button:active{
            background-color: black;
        }

    </style>
</head>

<body>

    <div class="main">

        <nav>

            <h2>Travel</h2>

            <div >
                <a class="a" href="#">Home</a>
                <a class="a" href="#">Places</a>
                <a class="a" href="#">Contact</a>
            </div>

        </nav>

        <div class="content">

            <h1>Explore The World</h1>

            <p>
                Discover beautiful places and create amazing memories.
            </p>

            <button>
                Explore Now
            </button>

        </div>

    </div>

</body>
</html>
