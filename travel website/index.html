<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Website</title>

    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            
            background-color: rgb(2, 12, 62);
            color: aliceblue;
        }
        nav{
            display: flex;
            justify-content: space-between;
            padding: 20px;
            margin: 10px;
        }
        nav a{
            background-color: aliceblue;
            border: none;
            border-radius: 10px;
            margin: 5px;
            padding: 10px;
        }
        h2{
            color: rgb(32, 70, 196);
            font-size: 60px;
            
        }

        .content{
            text-align: center;
            margin-top: 150px;
        }

        .content h1{
            font-size: 50px;
            margin-bottom: 20px;
        }

        .content p{
            font-size: 20px;
            margin-bottom: 30px;
        }

        button{
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            background-color: white;
            font-weight: bold;
            font-size: 15px;
            color: rgb(0, 0, 0) ;
        }

        button:hover{
            background-color: rgb(35, 7, 163);
            color: white;
            border: 1px solid white;
        }
        div .a{
            display: inline-block;
            justify-content: center;
            height: 40px;
            margin: 10px;
            width: 65px;
            text-align: center;
            align-items: center;
            
        }
        .a:hover{
            background-color: rgb(29, 48, 176);
            color: aliceblue;
            border: 1px solid rgb(232, 226, 226);
        }
        .a:active{
            background-color: rgb(14, 13, 14);
        }
        button:active{
            background-color: black;
            
        }

    </style>
</head>

<body>

    <div>

        <nav>

            <h2>Travel</h2>

            <div >
                <a class="a" href="#">Home</a>
                <a class="a" href="#">Places</a>
                <a class="a" href="#">Contact</a>
            </div>

        </nav>

        <div class="content">

            <h1>Explore The World</h1>

            <p>
                Discover beautiful places and create amazing memories.
            </p>

            <button>
                Explore Now
            </button>

        </div>

    </div>

</body>
</html>
