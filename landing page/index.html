<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Landing Page</title>

    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            /* background-image: url("images.jpg"); */
            background-size: cover;
            background-position: center;
            /* background-repeat: no-repeat; */
            height: 100vh;
            color: white;
        }

        .main{
            background-color: rgba(0, 0, 0, 0.6);
            height: 100vh;
        }

        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
        }

        .logo{
            color: red;
            font-size: 40px;
            font-weight: bold;
        }

        .btn{
            background-color: red;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
        }

        .btn:hover{
            background-color: darkred;
        }

        .content{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            margin-top: 150px;
        }

        .content h1{
            font-size: 50px;
            margin-bottom: 20px;
        }

        .content h2{
            font-size: 25px;
            margin-bottom: 20px;
        }

        .content p{
            font-size: 18px;
            margin-bottom: 20px;
        }

        .email{
            width: 350px;
            height: 50px;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
        }

        .start{
            background-color: red;
            color: white;
            border: none;
            padding: 15px 30px;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 18px;
        }

        .start:hover{
            background-color: darkred;
        }

    </style>
</head>

<body>

    <div class="main">

        <nav>

            <div class="logo">
                NETFLIX
            </div>

            <button class="btn">
                Sign In
            </button>

        </nav>


        <div class="content">

            <h1>Unlimited movies, TV shows, and more</h1>

            <h2>Watch anywhere. Cancel anytime.</h2>

            <p>
                Ready to watch? Enter your email to create or restart your membership.
            </p>

            <input 
                class="email" 
                type="email" 
                placeholder="Email address"
            >

            <button class="start">
                Get Started
            </button>

        </div>

    </div>

</body>
</html>
