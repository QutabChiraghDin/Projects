<!DOCTYPE html>
<html lang="en">
<head>

            background-color: aliceblue;

        }

        }
        .content {
            margin-bottom: 20px;
        }
        .b button{
            border: 2px solid black;
            border-radius: 10px;

        }
        .b{
            margin: 20px;

        }

    </style>

    <div class="parent">
        <div class="image">
            <img src="images.jpg" alt="">
        </div>
        <div class="content">
            <span>Nature </span>

        </div>
        <div class="info">

        </div>
    </div>
    
</body>
</html>
