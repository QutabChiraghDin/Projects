<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url(images.jpg);

        }

        form {
            background-color: transparent;
            backdrop-filter: blur(10px);
            border: 2px solid rgb(233, 228, 228);
            border-radius: 50px;
            height: 85vh;
            /* width: 500px; */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
          

        }

        form {
            
            position: absolute;
            width: 400px;
            margin: 30px 0;
            margin-left: 450px;
        }

        form label {
            color: aliceblue;
            font-size: 1.2rem;
            margin: 10px;
            position: absolute;
            left: 10px;

        }

        form input[type="email"],
        form input[type="password"] {
            color: aliceblue;
            background-color: transparent;
            height: 50px; 
            border: none;
            outline: none;
            border-bottom: 3px solid white;
            height: 10vh; 
             width: 20vw;
            margin: 20px;
            font-size: 20px;


        }

        .login {
            color: aliceblue;
            font-size: 2rem;
            position: fixed;
            top: 30px;
        }

        .red {
            height: 50px;
            width: 180px;
            border-radius: 50px;
            text-transform: uppercase;
            margin: 15px;
            font-size: 1.4rem;
            background-color: rgb(227, 219, 219);
            color: rgb(0, 0, 0);
            border-bottom: none;
            padding: 10px;
        }
        .b{
            width: 15px;
        }
        p{
            color: aliceblue;
        }
        

        p>a {
            color: rgb(225, 230, 224);
            font-size: 15px;
        }
        footer{
            
           color: rgb(0, 0, 0);
           font-size: 2rem;
           position: fixed;
           bottom: 20px;
            left: 30%;
        }
        .red:hover{
            color: rgb(202, 214, 214);
            background-color: transparent;
        }
        .red:active{
            background-color: rgb(71, 94, 36);
            border: 2px solid black;
        }
        a:hover{
            color: aliceblue;
            text-decoration: underline;
            font-style: italic;
            font-weight: 800;
        }
      
    </style>
</head>

<body>
    <form action="action">
        <div class="login">
            Login
        </div>
        <div class="form">
            <label for="email">Email</label>
            <input type="email" required>
        </div>
        <div class="form">
            <label for="password">Password</label>
            <input type="password" required>
        </div>
        <div>
            <p class="blue">
                <input class="b" type="checkbox">Remember me <a href="#">Forget password</a>
            </p>
        </div>
        <p>
            <input class="red" type="submit" value="Login">
        </p>
        <p>Dont have an account <a href="#">Register</a> </p>

    </form>
    <footer>About our Nature is a journey of our dreams  </footer>

</body>

</html>
