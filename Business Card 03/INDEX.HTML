<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;margin: 0;

        }
        body{
            background-color: rgb(1, 73, 125);
            padding: 45px;


        }
        .parent{
            background-color: aliceblue;
            border: 2px solid black;
            border-radius: 7px;
            width: 350px;
            height: 490px;
            margin-left: 450px;
        }
        .image img{
            border: 7px;
            border-radius: 7px;
            width: 300px;
            height: 200px;
            margin: 9px;
            padding: 5px;
            border: 1px solid gray;
            border-radius: 18px;
        }
        .image{
              text-align: center;
        }
        .content span{
             border: 2px solid rgb(70, 69, 69);
             border-radius: 10px;
             margin-left: 70px;
             padding: 6px;
             color: gray;
             font: 18px; 
        }

        .content {
            margin-top: 15px;
           
            
        }
        .info{
            padding: 10px;
            margin: 15px;

        }
        .info h2{
            padding: 5px;
           
        }
        button{
            border: 1px solid black;
            border-radius: 20px;
            width: 8vw;
            height: 7vh;
            margin-left: 120px;
            position: fixed;
            margin-top: -45px;
            font-weight: bold;
        }
        button:hover{
            color: white;
            background-color: black;
        }
       
        .info p{
            color: rgb(166, 158, 158);
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="image">
            <img src="images.jpg" alt="">
        </div>
        <div class="content">
            <span>Nature </span>
            <span>Flowers</span>
        </div>
        <div class="info">
            <h2>NatureHub</h2>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Eligendi sed, voluptatum enim soluta, id consequuntur sunt modi necessitatibus illo exercitationem, perspiciatis ipsam omnis.</p>
        </div>
        
            <button>Submit</button>
       
    </div>
    
</body>
</html>
