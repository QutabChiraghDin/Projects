<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url(image.jpg);
            height: 50vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;

        }

        form {
            backdrop-filter: blur(10px);
            border: 2px solid rgb(254, 252, 252);
            border-radius: 50px;
            width: 400px;
            height: 500px;
            /* background-color: aqua; */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .login h1 {
            color: rgb(234, 236, 233);
            font-size: 2rem;


        }

        /* position relative karny sy item apni orignal state rahty ha */
        .form {
            margin-top: 80px;
            position: relative;
            width: 350px;
            margin: 30px 0;

        }

        .form input {
            width: 100%;
            height: 50px;
            background-color: transparent;
            border: none;
            outline: none;
            color: aliceblue;
            font-size: 1.3rem;
            padding: 0 25px 0 10px;
            border-bottom: 3px solid rgb(255, 253, 253);

        }

        .form label {
            position: absolute;
            top: 50%;
            left: 10px;
            color: white;
            margin-top: -30px;
            transform: translateY(-50%);
            transition: 0.5s;
        }

        input:focus~label,
        input:valid~label {
            top: -50px;

        }

        p {
            text-align: center;
            color: aliceblue;
            padding: 12px 0;
        }

        p>a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        p>a:hover {
            text-decoration: underline;
            font-style: italic;
        }

        .btn {
            height: 50px;
            width: 70%;
            border-radius: 50px;
            text-transform: uppercase;
            margin: 5px;
            font-size: 1.4rem;
            background-color: white;
            color: black;
        }
        .btn:hover{
                  
                 border: 2px solid blueviolet;         
        }
        .btn:active{
            background-color: transparent; 
        }
    </style>
</head>

<body>
    <form action="post">
        <div class="login">
            <h1>Login</h1>
        </div>
        <div class="form">
            <label for="">Email</label>
            <input type="email" required>
        </div>
        <div class="form">
            <label for="password">password</label>
            <input type="password" required>
        </div>
        <p>
            <input type="checkbox">Remember Me <a href="#">Forget password</a>
        </p>
        <input class="btn" type="button" value="Login">
        <p>
            Dont have an account <a href="#">Register</a>
        </p>
    </form>


</body>

</html>
