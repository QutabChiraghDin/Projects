<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> forms - in html</title>
</head>

<body>
    <form action="post"></form>
    <div>
        <h1>form to apply the teaching </h1>
        <label for="username"> enter your password</label>
        <input type="password" name="password" placeholder="Enter your password">
    </div>
    <div>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
    </div>
    <div>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
        <label for="subscribe">Subscribe to newsletter</label>
    </div>
    <div>
        <label for="comment"></label>
        <textarea id="comment" name="comment" rows="4" cols="50"></textarea>
    </div>
    <div>
         <label for="number"> Please Enter Your number</label>
         <input type="number" id="number" min="0" max="100">
      </div>
      <div>
        <input type="tel" id="telephone" placeholder="50">
      </div>
    <div>
        <select name="fruits">
            <option value="apple">Apple</option>
            <option value="banana">Banana</option>
            <option value="cherry">Cherry</option>
        </select>
    </div>
    </form>
</body>

</html>
